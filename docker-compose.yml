name: auditoria

services:
  postgres:
    image: postgres:15
    container_name: auditoria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auditoria}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Banco dedicado do Keycloak — isolado do banco da aplicação (sem porta no host).
  keycloak-db:
    image: postgres:15
    container_name: auditoria-keycloak-db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: auditoria-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    expose:
      - "8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Keycloak 26 é UBI-based: não tem curl/wget. Health endpoints vivem na porta
    # de management 9000 (KC_HEALTH_ENABLED). Usa bash /dev/tcp + grep no /health/ready.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ../backend
      network: host
    container_name: auditoria-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DEBUG: ${DEBUG:-true}
      # Issuer público (bate com a claim `iss` do token, emitida via KC_HOSTNAME); JWKS interno.
      KEYCLOAK_ISSUER: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/auditoria
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_URL:-http://keycloak:8080}/realms/auditoria/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: auditoria-frontend
      KEYCLOAK_AUDIENCE: auditoria-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  nextjs:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-${KEYCLOAK_HOSTNAME:-http://localhost:8080}}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-auditoria}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-auditoria-frontend}
    container_name: auditoria-frontend
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: auditoria-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      nextjs:
        condition: service_started
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "envsubst '$${BACKEND_URL} $${KEYCLOAK_URL}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  keycloak-pgdata:
