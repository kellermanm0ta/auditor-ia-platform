name: auditoria

services:
  postgres:
    image: postgres:15
    container_name: auditoria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - app-network

  # One-shot: cria o database/role do Keycloak no Postgres unico (idempotente).
  db-init:
    image: postgres:15
    container_name: auditoria-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./scripts/create-keycloak-db.sh:/create-keycloak-db.sh:ro
    entrypoint: ["bash", "/create-keycloak-db.sh"]
    restart: "no"
    networks:
      - app-network

  keycloak:
    build: ./keycloak
    image: auditoria-keycloak:26.4.0
    container_name: auditoria-keycloak
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Consumidos pelos placeholders do realm-export.json no import (dev).
      KEYCLOAK_DEV_USER: ${KEYCLOAK_DEV_USER}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      # Admin console via acesso local/túnel (não é roteado pelo nginx).
      KC_HOSTNAME_ADMIN: http://localhost:8080
      # Heap enxuto para 1 vCPU (dev mode desligado + metaspace limitado).
      JAVA_OPTS_APPEND: "-Xms64m -Xmx320m -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=1"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    expose:
      - "8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # Keycloak 26 é UBI-based: não tem curl/wget. Health endpoints vivem na porta
    # de management 9000 (KC_HEALTH_ENABLED). Usa bash /dev/tcp + grep no /health/ready.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 640m
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ../backend
      network: host
    container_name: auditoria-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DEBUG: ${DEBUG}
      # Issuer público (bate com a claim `iss` do token, emitida via KC_HOSTNAME); JWKS interno.
      KEYCLOAK_ISSUER: ${KEYCLOAK_HOSTNAME}/realms/auditoria
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_URL}/realms/auditoria/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: auditoria-frontend
      KEYCLOAK_AUDIENCE: auditoria-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - app-network

  nextjs:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-${KEYCLOAK_HOSTNAME}}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
    container_name: auditoria-frontend
    environment:
      NODE_OPTIONS: "--max-old-space-size=192"
    depends_on:
      - backend
    expose:
      - "3000"
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: auditoria-nginx
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_TLS_PORT}:443"
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      nextjs:
        condition: service_started
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 32m
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "envsubst '$${BACKEND_URL} $${KEYCLOAK_URL}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
